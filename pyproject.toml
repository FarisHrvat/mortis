[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mortis-spatial"
version = "0.1.0"
description = "Cohort-scale analysis for spatial metabolomics: patient-level statistics, differential spatial organization, and publication figures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Faris Hrvat", email = "farishrvatit@gmail.com" },
]
keywords = [
    "spatial metabolomics",
    "imaging mass spectrometry",
    "MALDI",
    "DESI",
    "bioinformatics",
    "anndata",
    "scanpy",
]
urls = { Homepage = "https://farishrvat.github.io/mortis/", Documentation = "https://farishrvat.github.io/mortis/", Repository = "https://github.com/FarisHrvat/mortis", Changelog = "https://github.com/FarisHrvat/mortis/blob/main/CHANGELOG.md" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anndata>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scanpy>=1.9.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.10.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "numba>=0.58.0",
    "threadpoolctl>=3.1.0",
    "h5py>=3.9.0",
    "openpyxl>=3.1.0",
    "tifffile>=2023.1.0",
    "harmonypy>=0.0.9",
    "psutil",
]

[project.optional-dependencies]
# esda/libpysal are only used by tests/test_correctness_vs_reference.py, to
# cross-check the custom spatial statistics (Moran's I, Geary's C, Gi*)
# against an independent published implementation. Never imported by
# mortis itself — skipped automatically if not installed.
dev = ["pytest>=7.0", "pytest-cov", "ruff", "build", "esda", "libpysal"]
fast-io = ["pyarrow", "python-calamine"]
image-network = ["networkx", "adjustText"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mortis = ["data/*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: line length is enforced via `line-length` above, not as an error.
# E701: this codebase consistently uses single-line `if x: y` guard clauses
# (e.g. `if copy: adata = adata.copy()`) as a deliberate terse style.
ignore = ["E501", "E701"]

[tool.ruff.lint.per-file-ignores]
# The validation script is a standalone program, not library code, so it is
# allowed to print and to be a little more script-shaped than the package.
"validation/run_validation.py" = ["E402"]
