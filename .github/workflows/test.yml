name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is the last Intel runner; macos-latest is Apple Silicon.
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-13
            python-version: "3.10"
          - os: macos-13
            python-version: "3.11"
          - os: macos-13
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install -e ".[dev]"

      - run: pytest tests/ -q --cov=mortis --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  default-install:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: |
          python -c "import mortis; print(mortis.__version__)"
          mortis info
      - name: leidenalg and igraph stay out of the base install
        run: |
          python - <<'PY'
          import importlib.util as u
          found = [n for n in ("leidenalg", "igraph") if u.find_spec(n)]
          assert not found, f"GPL packages in a default install: {found}"
          PY
