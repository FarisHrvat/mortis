name: Deploy Docs

# Deploys web/ at / and the MkDocs site at /reference/.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package and the docs toolchain
        run: |
          python -m pip install -e .
          python -m pip install mkdocs-material mkdocs-glightbox

      - name: Regenerate the API index from the installed package
        run: python web/build_api.py

      - name: Build the MkDocs handbook
        run: mkdocs build --strict --site-dir _handbook

      - name: Assemble the site
        run: |
          mkdir -p _site/reference
          cp -r web/index.html web/api.json web/assets _site/
          cp -r _handbook/. _site/reference/
          # Pages hides underscore-prefixed paths without this.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

