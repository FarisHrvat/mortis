name: Publish to PyPI

# Deliberately manual. A PyPI version can never be reused, so publishing is
# a button you press, not something a tag does on your behalf.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: |
          tag="${{ inputs.tag }}"
          tag="${tag#v}"
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match version $version"
            exit 1
          fi

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: Install the wheel on its own
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "import mortis; print(mortis.__version__)"
          /tmp/check/bin/mortis info

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mortis-spatial
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
