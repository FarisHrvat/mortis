name: Publish to PyPI

# Runs on a version tag: `git tag v0.1.0 && git push --tags`.
#
# Publishing uses PyPI's Trusted Publishing (OIDC), so there is no API token to
# keep in secrets. Two things have to exist before the first release:
#   1. this repo and workflow filename registered at
#      https://pypi.org/manage/account/publishing/
#   2. a GitHub environment named `pypi` (Settings > Environments)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in pyproject.toml
        # Without this, tagging v0.2.0 while pyproject still says 0.1.0
        # publishes 0.1.0 and burns the version number on PyPI, which cannot
        # be reused even after deleting the release.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - run: python -m pip install --upgrade build twine

      - run: python -m build

      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*

      - name: Install the wheel on its own and import it
        # Catches a missing package-data file or a dependency that only
        # resolves because it happens to be in the dev environment.
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "import mortis; print(mortis.__version__, len(mortis.__all__), 'names')"
          /tmp/check/bin/python -c "import mortis; mortis.list_drug_matches"
          /tmp/check/bin/mortis info

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mortis-spatial
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
