# conda/mamba environment for a login node.
#
#     mamba env create -f hpc/environment.yml
#     mamba activate mortis
#     pip install -e .            # or: pip install mortis-spatial[cli]
#
# The heavy compiled dependencies come from conda-forge because that is where
# the prebuilt HPC-friendly builds live; MORTIS itself goes in with pip.

name: mortis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - h5py
  - numba
  - scikit-learn
  - statsmodels
  - matplotlib-base        # -base: no Qt, which a headless node cannot use anyway
  - seaborn
  - leidenalg
  - python-igraph
  - anndata
  - scanpy
  - umap-learn
  - threadpoolctl
  - openpyxl
  - tifffile
  - psutil
  - pyyaml
  - pip
