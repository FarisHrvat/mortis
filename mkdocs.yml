site_name: MORTIS
site_description: High-performance downstream analysis for spatial metabolomics (imaging mass spectrometry), built on AnnData/scanpy.
site_url: https://farishrvat.github.io/mortis/
repo_name: FarisHrvat/mortis
repo_url: https://github.com/FarisHrvat/mortis
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FarisHrvat/mortis
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart (no Python experience needed): getting-started/quickstart.md
      - Complete Workflow: getting-started/complete-workflow.md
  - Tutorials (real data walkthroughs):
      - Overview: tutorials/index.md
      - "1. QC & Annotation Scoring (tissue + background pair)": tutorials/01-qc-and-scoring.md
      - "2. Single-Sample Deep Dive (spatial stats & domains)": tutorials/02-single-sample-deep-dive.md
      - "3. Large-Scale Microenvironments (NMF, 30k pixels)": tutorials/03-large-scale-microenvironments.md
      - "4. Cohort Comparison (Responder vs Non-Responder)": tutorials/04-cohort-comparison.md
  - Concepts:
      - Choosing a Normalization Method: concepts/normalization.md
      - Batch Correction & Verifying It Worked: concepts/batch-correction.md
      - Spatial Statistics Explained: concepts/spatial-statistics.md
      - Performance & Threading: concepts/performance.md
  - API Reference:
      - Overview: api/index.md
      - I/O: api/io.md
      - ROI Selection: api/roi.md
      - Preprocessing: api/preprocessing.md
      - Filtering: api/filtering.md
      - Analysis - Clustering: api/analysis-clustering.md
      - Analysis - Differential Expression: api/analysis-de.md
      - Analysis - Spatial Statistics: api/analysis-spatial.md
      - Analysis - Validation & QC: api/analysis-validation.md
      - Analysis - Multi-sample & Enrichment: api/analysis-multisample.md
      - Plotting: api/plotting.md
      - Image (Histology Overlay): api/image.md
      - Exceptions: api/exceptions.md
  - Plot Gallery: gallery.md
  - Contributing: contributing.md
  - Changelog: changelog.md
